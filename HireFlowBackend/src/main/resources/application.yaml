spring:
  config:
    import: optional:file:./HireFlowBackend/.env.properties
  application:
    name: HireFlowBackend

  data:
    mongodb:
      uri: mongodb://localhost:27017/jobportal
      auto-index-creation: true

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_USERNAME}
    password: ${BREVO_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true